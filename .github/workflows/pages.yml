# Builds site/ and deploys it to GitHub Pages
name: Deploy site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
    paths:
      - "cheatsheet/**"
      - "site/**"
      - ".github/workflows/pages.yml"
    # Spec releases change the spec version the landing page links to
    tags: ["v*"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # By default the github-pages environment only accepts deployments from main,
  # so a release tag triggers a run on main instead of deploying itself.
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Redeploy from main
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    if: github.ref_type != 'tag'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Tags determine the spec version the landing page links to.
          fetch-depth: 0
      - name: Install Go 1.27.2
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
          check-latest: true
          cache-dependency-path: cheatsheet/go.sum
      - name: Generate site
        working-directory: cheatsheet
        run: make gendist
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
